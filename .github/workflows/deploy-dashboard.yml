name: Deploy Dashboard

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Custom range start date (YYYY-MM-DD)'
        required: false
        type: string
      end_date:
        description: 'Custom range end date (YYYY-MM-DD)'
        required: false
        type: string
      full_sync:
        description: 'Run full 3-month sync instead of incremental'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine sync mode
        id: sync_mode
        run: |
          if [ "${{ inputs.full_sync }}" = "true" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          elif [ "$(date +%H)" = "00" ]; then
            echo "mode=nightly" >> $GITHUB_OUTPUT
          else
            echo "mode=incremental" >> $GITHUB_OUTPUT
          fi
          echo "hour=$(date +%H)" >> $GITHUB_OUTPUT

      - name: Nightly full sync — fetch runs (skip jobs for speed)
        if: steps.sync_mode.outputs.mode == 'full' || steps.sync_mode.outputs.mode == 'nightly'
        env:
          GITHUB_TOKEN: ${{ secrets.VLLM_ASCEND_TOKEN || github.token }}
        run: |
          echo "::group::Full sync: fetching workflow runs (3 months)"
          python scripts/monitor/sync_data.py --db data/build_metrics.db --full-sync --skip-jobs --months-back 3 --timeout 120
          echo "::endgroup::"

      - name: Nightly full sync — fetch jobs for recent runs
        if: steps.sync_mode.outputs.mode == 'full' || steps.sync_mode.outputs.mode == 'nightly'
        env:
          GITHUB_TOKEN: ${{ secrets.VLLM_ASCEND_TOKEN || github.token }}
        run: |
          echo "::group::Fetching jobs for runs in last 7 days"
          python scripts/monitor/sync_data.py --db data/build_metrics.db --lookback 168 --timeout 120
          echo "::endgroup::"

      - name: Incremental sync — recent runs + jobs
        if: steps.sync_mode.outputs.mode == 'incremental'
        env:
          GITHUB_TOKEN: ${{ secrets.VLLM_ASCEND_TOKEN || github.token }}
        run: |
          echo "::group::Incremental sync: last 24 hours"
          python scripts/monitor/sync_data.py --db data/build_metrics.db --lookback 24 --timeout 60
          echo "::endgroup::"

      - name: Export dashboard JSON files
        env:
          GITHUB_TOKEN: ${{ secrets.VLLM_ASCEND_TOKEN || github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
        run: |
          python scripts/report/export_dashboard.py --db data/build_metrics.db --range all --output dashboard/dashboard_all.json
          python scripts/report/export_dashboard.py --db data/build_metrics.db --range 1d --output dashboard/dashboard_1d.json
          python scripts/report/export_dashboard.py --db data/build_metrics.db --range 7d --output dashboard/dashboard_7d.json
          python scripts/report/export_dashboard.py --db data/build_metrics.db --range 30d --output dashboard/dashboard_30d.json

      - name: Export custom range (if requested)
        if: ${{ inputs.start_date != '' && inputs.end_date != '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
        run: |
          python scripts/report/export_dashboard.py --db data/build_metrics.db --range custom --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" --output dashboard/dashboard_custom.json

      - name: Persist dashboard data to repo
        run: |
          git config user.name "build-eye-dashboard"
          git config user.email "build-eye-dashboard@users.noreply.github.com"
          git add dashboard/dashboard_all.json dashboard/dashboard_1d.json dashboard/dashboard_7d.json dashboard/dashboard_30d.json dashboard/dashboard_custom.json data/build_metrics.db || true
          git diff --staged --quiet || git commit -m "Update dashboard data [skip ci]"
          git stash -u || true
          git pull --rebase --strategy-option ours || git rebase --abort || true
          git stash pop || true
          git push || true

      - name: Send notification
        if: ${{ always() }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
        run: |
          for ptype in Nightly Weekly PR; do
            python scripts/notify/notifier_cli.py \
              --report-type "$ptype" \
              --summary dashboard/dashboard_all.json || true
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages
          cname: false

      - name: Summary
        if: ${{ always() }}
        run: |
          echo "## Dashboard Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sync mode: **${{ steps.sync_mode.outputs.mode }}**" >> $GITHUB_STEP_SUMMARY
          echo "Trigger hour: **${{ steps.sync_mode.outputs.hour }}** UTC" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.sync_mode.outputs.mode }}" = "nightly" ] || [ "${{ steps.sync_mode.outputs.mode }}" = "full" ]; then
            echo "Actions: full 3-month runs sync + 7-day jobs sync" >> $GITHUB_STEP_SUMMARY
          else
            echo "Actions: incremental 24-hour sync" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Source repo: vllm-project/vllm-ascend" >> $GITHUB_STEP_SUMMARY